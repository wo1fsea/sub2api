global
    log stdout format raw local0
    stats socket ipv4@127.0.0.1:9999 level admin

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 10m
    timeout server 10m
    timeout tunnel 0
    retries 0

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend stable
    bind :8080
    use_backend %[str(active),map_str(/var/lib/sub2api-ingress/active.map,blue)]

backend blue
    option httpchk GET /health
    http-response set-header X-Sub2API-Slot blue
    server blue ${SUB2API_BLUE_UPSTREAM} check resolvers docker init-addr last,libc,none

backend green
    option httpchk GET /health
    http-response set-header X-Sub2API-Slot green
    server green ${SUB2API_GREEN_UPSTREAM} check resolvers docker init-addr last,libc,none
